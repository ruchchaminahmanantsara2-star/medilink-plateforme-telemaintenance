<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediLink — Télémaintenance biomédicale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

<!-- Écran de connexion -->
<div id="ecran-login" class="ecran-login">
  <div class="login-card">
    <div class="login-brand">
      <svg class="ekg-mark" viewBox="0 0 120 32" width="60" height="16"><polyline points="0,16 20,16 26,4 32,28 38,16 120,16" /></svg>
      <span>MediLink</span>
    </div>
    <p class="login-sub">Plateforme collaborative de télémaintenance biomédicale</p>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="rakoto@sante.mg" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-family:var(--font-body); font-size:14px; margin-bottom:14px;">
    <label>Mot de passe</label>
    <input type="password" id="login-mdp" placeholder="demo123" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-family:var(--font-body); font-size:14px; margin-bottom:18px;">
    <button id="btn-login" class="btn-primary">Se connecter</button>
    <p id="login-erreur" style="color:#B14A36; font-size:13px; margin-top:10px; display:none;"></p>
    <p class="login-hint">Comptes de démonstration (mot de passe <code>demo123</code>) :<br>rakoto@sante.mg · andry@maintenance.mg · rasoa@expert.mg<br>hery@hopital.mg · admin@plateforme.mg</p>
  </div>
</div>

<!-- Application -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg class="ekg-mark" viewBox="0 0 120 32" width="52" height="14"><polyline points="0,16 20,16 26,4 32,28 38,16 120,16" /></svg>
      <span>MediLink</span>
    </div>
    <nav>
      <button class="nav-item active" data-vue="dashboard">Tableau de bord</button>
      <button class="nav-item" data-vue="equipements">Équipements</button>
      <button class="nav-item" data-vue="incidents">Incidents</button>
      <button class="nav-item" data-vue="interventions">Interventions</button>
      <button class="nav-item" data-vue="connaissances">Base de connaissances</button>
    </nav>
    <div class="user-box">
      <div class="user-name" id="user-nom"></div>
      <div class="user-role" id="user-role"></div>
      <button id="btn-logout" class="btn-link">Changer de compte</button>
    </div>
  </aside>

  <main class="contenu">
    <section id="vue-dashboard" class="vue"></section>
    <section id="vue-equipements" class="vue hidden"></section>
    <section id="vue-incidents" class="vue hidden"></section>
    <section id="vue-interventions" class="vue hidden"></section>
    <section id="vue-connaissances" class="vue hidden"></section>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
